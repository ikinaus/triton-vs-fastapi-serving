version: "3.8"

services:
  # Triton Inference Server
  triton:
    container_name: triton-clml
    image: nvcr.io/nvidia/tritonserver:24.10-py3
    ports:
      - 8000:8000 # HTTP API
      - 8001:8001 # gRPC API
      - 8002:8002 # Metrics Monitoring
    restart: always
    volumes:
      - ./model_repository:/models
    command: [ "tritonserver", "--model-repository=/models" ]
